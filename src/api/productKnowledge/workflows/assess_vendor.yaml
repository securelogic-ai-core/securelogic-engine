id: assess_vendor
title: 'Assess or review a vendor'
goal: 'Evaluate a vendor''s risk with a point-in-time assessment or an ongoing review cycle.'
permissions: platform
navigation:
  - Assets
  - Vendors
routes:
  - /vendors
  - /vendors/[id]/assess
  - /vendors/[id]/review
ordered_steps:
  - 'Open Assets → Vendors and select the vendor to open its detail page.'
  - 'For a point-in-time assessment, click "New Assessment" (/vendors/[id]/assess).'
  - 'For an ongoing cycle, click "New Review Cycle" (/vendors/[id]/review).'
  - 'Record the assessment type, the overall severity you have judged, and a summary, then save.'
  - 'To assess the vendor against a compliance framework instead, use "Assess against a framework" (/vendors/[id]/assess/framework) and answer each requirement.'
expected_result: 'The assessment is recorded, the vendor''s risk score is recalculated from its open findings, and the assessment appears in the vendor''s history.'
common_mistakes:
  - 'Assessing a vendor that has not been added yet — add the vendor first.'
  - 'Confusing a one-off assessment with a recurring review cycle.'
related_workflows:
  - add_vendor
  - review_findings
