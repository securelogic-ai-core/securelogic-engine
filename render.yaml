  # =========================================================
  # SECURELOGIC APP (Next.js frontend)
  # User-facing web application: landing, registration, login,
  # brief archive, account, and billing flows.
  # Calls the engine API server-side; never exposes secrets
  # or API keys to the browser.
  # =========================================================

  - type: web
    name: securelogic-app
    region: oregon
    env: node
    plan: starter
    buildCommand: cd app && npm ci --include=dev && rm -rf .next && npm run build
    startCommand: cd app && npx next start -p $PORT
    autoDeploy: true
    # Readiness probe. Verifies the app process is CONFIGURED to serve
    # (SESSION_SECRET usable, ENGINE_API_URL set and not the localhost default),
    # deliberately without calling the engine or the database — a dependency
    # blip must not fail the app's own health check and cascade into a second
    # outage. See app/src/app/api/health/route.ts.
    healthCheckPath: /api/health
    envVars:
      # Environment identity. LOAD-BEARING since P1-2 (email environment
      # isolation): infra/emailEnvironment.ts tags every outbound send with
      # this value and classifies every inbound provider event against it,
      # and lib/providerSuppressionRecoveryPolicy.ts refuses the destructive
      # provider-suppression clear unless it reads exactly "production".
      # An unset value resolves to "unknown", which fails closed everywhere
      # -- safe, but it silently disables both. Declared here rather than
      # left as dashboard-only state so it survives a Blueprint sync and is
      # visible in review.
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production

      # Internal URL of the securelogic-engine service on Render.
      # Use the private service URL (e.g. https://securelogic-engine.onrender.com)
      # so traffic stays within the Render network.
      - key: ENGINE_API_URL
        sync: false

      # Public URL of the securelogic-engine service, bundled into the
      # browser for SSO check-domain and SSO login redirects.
      # Must be the public Render URL (reachable from end-user browsers).
      - key: NEXT_PUBLIC_ENGINE_URL
        sync: false

      # Public URL of the marketing website (securelogic-website), used by the
      # app Header (logo/home link) and the consent legal links
      # (terms/privacy/ai-policy). Set each environment to its OWN marketing site
      # so the STAGING app never links users back to the production site.
      # Prod: https://www.securelogicai.com · Staging: the staging website URL.
      # BUILD-TIME (NEXT_PUBLIC_*): a value change requires an app REBUILD.
      # The securelogic-app-staging service is now defined below in this file;
      # set its staging value on that service. Code falls back to the prod apex if
      # unset, so an unset prod build stays correct while an unset staging build
      # leaks prod.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # ECL (Priority 5) nav visibility — DARK (default off). App half of the
      # two-switch model: this only reveals the "Context" header item; the engine's
      # own SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED independently 404s every ECL
      # route. RUNTIME (not NEXT_PUBLIC): a restart applies it, no rebuild.
      # The securelogic-app-staging service is defined below in this file — set it
      # true there for staging validation. Prod flip is GATE B (operator ledger L-2).
      - key: SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED
        value: "false"

      # EAR Phase 4 nav visibility — DARK (default off). App half of the
      # two-switch model for the unified Assets surface: this only reveals the
      # "Asset Registry" header item; the engine's own
      # SECURELOGIC_ASSET_REGISTRY_ENABLED independently 404s every registry
      # route. RUNTIME (not NEXT_PUBLIC): a restart applies it, no rebuild.
      # Prod flip is out of scope for the EAR goal (GATE B posture).
      - key: SECURELOGIC_ASSET_REGISTRY_ENABLED
        value: "false"

      # Enterprise Risk Workspace IA/nav (ERIP Packages 1+2) — DARK (default off).
      # Flips the app header to the enterprise-workflow information architecture
      # (Intelligence / Risk Operations / Assets / Compliance) and the "Review
      # Suggested Links" queue reskin. RUNTIME (not NEXT_PUBLIC): a restart applies
      # it, no rebuild. Presentation-only — no engine/query/schema change; flag off
      # is byte-for-byte the legacy nav. The securelogic-app-staging service is
      # defined below in this file — set it true there for staging validation. Prod
      # flip is GATE B.
      # This is the flag that changes the navigation, so it is also the flag the
      # WhatsNewPanel keys on — the orientation panel and the change it describes
      # share one lifecycle and roll back together. Prod stays DARK: enabling it
      # surfaces an "Approvals" nav entry whose page has no backing capability in
      # the production flag set (RISK_LIFECYCLE=false, RISK_ACCEPTANCE undeclared).
      - key: SECURELOGIC_RISK_WORKSPACE_ENABLED
        value: "false"

      # ERIP Package 3 (Decision Workspace) — DARK (default off). App half of the
      # two-switch model: renders the Decision Workspace on /findings/:id when on
      # AND the engine returns a context (engine flag on too). RUNTIME (not
      # NEXT_PUBLIC): a restart applies it. Flag off = legacy finding detail
      # byte-for-byte. Staging app is defined below in this file; prod flip is GATE B.
      - key: SECURELOGIC_DECISION_WORKSPACE_ENABLED
        value: "false"

      # Scalable Risk Findings queue controls — DARK (default off). Adds the
      # search/filter/sort toolbar, due-status urgency labels, and server-side
      # OFFSET pagination to the BROWSE findings queue (never the Operations
      # Center). RUNTIME (not NEXT_PUBLIC): a restart applies it. Flag off = the
      # legacy browse list, byte-for-byte. Staging app is defined below; prod flip
      # is GATE B. Engine-side: GET /api/findings already serves the new query
      # params (additive), so no engine flag is needed.
      - key: SECURELOGIC_FINDINGS_QUEUE_CONTROLS_ENABLED
        value: "false"

      # The Briefing (Briefing Initiative B1) — DARK (default off). Replaces the
      # /dashboard composition for platform tiers with the personalized Briefing
      # (My Work first, explicit "You" vs "Organization" scope chips) and relabels
      # the workspace nav's home entry. TWO-SWITCH: the engine half (same key, in
      # the securelogic-engine block) gates /api/briefing/layout and
      # /api/briefing/changes, which this app half calls — promote engine first,
      # and never enable the app half alone. RUNTIME (not NEXT_PUBLIC): a restart
      # applies it. Flag off = legacy dashboard byte-for-byte. Staging app is
      # defined below; prod flip is GATE B.
      # NAMING: deliberately DASHBOARD_BRIEFING — the SECURELOGIC_BRIEF* namespace
      # belongs to the Intelligence Brief product flags; do not shorten.
      - key: SECURELOGIC_DASHBOARD_BRIEFING_ENABLED
        value: "false"
      # B1 demotion (Launch Completion 1), app half of the two-switch: "true"
      # keeps the legacy assess/review CTAs and forms; "false" swaps every
      # legacy write CTA for the engagement workflow entry point. Keep in
      # lockstep with the engine's flag — the UI must never offer a write the
      # engine 410s.
      - key: SECURELOGIC_LEGACY_VENDOR_WRITES_ENABLED
        value: "true"

      # Secret used to encrypt the iron-session cookie.
      # Must be at least 32 characters. Generate with: openssl rand -hex 32
      - key: SESSION_SECRET
        sync: false

      # Legacy absolute session lifetime in seconds (default 8 h when set).
      # Superseded by SESSION_ABSOLUTE_SECONDS below; still honored as a fallback
      # so existing deployments keep their configured lifetime until migrated.
      - key: SESSION_TIMEOUT_SECONDS
        sync: false

      # PR-C1 session-timeout enforcement (runtime vars — a restart applies them;
      # neither is NEXT_PUBLIC/build-time, so no rebuild is required).
      #
      # Idle (sliding) timeout in seconds. Activity extends it. Default 1800 (30 min).
      - key: SESSION_IDLE_SECONDS
        sync: false
      # Absolute (non-extendable) timeout in seconds from login. Default 43200 (12 h).
      - key: SESSION_ABSOLUTE_SECONDS
        sync: false

      # Sentry error tracking (app). Values set in the Render dashboard.
      # SENTRY_DSN_APP is server-only; NEXT_PUBLIC_SENTRY_DSN_APP is inlined
      # into the browser bundle at build time (must be present at build to be
      # picked up). NEXT_PUBLIC_SENTRY_ENV labels the environment. All optional
      # — when unset the app builds and runs with Sentry disabled.
      # See docs/sentry-setup.md.
      - key: SENTRY_DSN_APP
        sync: false

      - key: NEXT_PUBLIC_SENTRY_DSN_APP
        sync: false

      - key: NEXT_PUBLIC_SENTRY_ENV
        sync: false

  # =========================================================
  # SECURELOGIC APP — STAGING (Next.js, tracks develop)
  # Staging peer of securelogic-app. Serves the customer-facing
  # UI whose workspace/Decision branches are gated by the app-side
  # SECURELOGIC_*_ENABLED flags below (read by the Next server:
  # findings/page.tsx, findings/[id]/page.tsx, actions/page.tsx,
  # queue/page.tsx, layout.tsx). This is where those flags must be
  # true for staging validation — the engine flags alone change no UI.
  #
  # ADOPTION NOTE: a dashboard-managed securelogic-app-staging service
  # has existed OUTSIDE this file (see the prior prod-app comments).
  # Render Blueprints match services BY NAME, so syncing this Blueprint
  # ADOPTS that existing service rather than creating a second one —
  # PROVIDED the operator reconciles it (operator ledger L-4). No
  # `domains:` block is declared, so the service keeps its unique
  # Render-assigned *.onrender.com URL and no custom domain is duplicated.
  # Nothing here creates or mutates a live Render service; the sync is an
  # operator action.
  #
  # STAGING-SAFE: every secret is `sync: false` (values set on the
  # staging service in the dashboard — NEVER prod secrets), engine/site
  # URLs point at the STAGING engine/website (not prod), telemetry is the
  # staging Sentry env. All four feature flags default OFF (dark).
  # =========================================================

  - type: web
    name: securelogic-app-staging
    region: virginia          # co-located with securelogic-engine-staging
    env: node
    plan: starter
    branch: develop
    buildCommand: cd app && npm ci --include=dev && rm -rf .next && npm run build
    startCommand: cd app && npx next start -p $PORT
    autoDeploy: true
    # Was /login, which only proved Next was serving HTML — an app booted without
    # SESSION_SECRET or ENGINE_API_URL renders it perfectly while being unable to
    # authenticate anyone or reach the engine. Same probe as production so the two
    # environments report readiness identically.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production      # required for `next start` (prod build); env identity is APP_ENV
      - key: APP_ENV
        value: staging

      # STAGING engine URLs — established pattern is `sync: false` (set on the
      # service in the dashboard). Point ENGINE_API_URL at the securelogic-engine-
      # staging PRIVATE URL and NEXT_PUBLIC_ENGINE_URL at its PUBLIC URL. NEVER the
      # production engine. NEXT_PUBLIC_* is build-time — a value change needs a rebuild.
      - key: ENGINE_API_URL
        sync: false
      - key: NEXT_PUBLIC_ENGINE_URL
        sync: false

      # STAGING marketing site (securelogic-website-staging) — never the prod apex,
      # so the staging app never links users back to production. Build-time.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # Feature flags — DARK (default off). App half of the two-switch model; a
      # RESTART applies them (RUNTIME, not NEXT_PUBLIC). Set to "true" on THIS
      # staging service to activate the redesign for staging validation:
      #   RISK_WORKSPACE     -> /findings decision queue, /queue "Review Suggested
      #                         Links" reskin + bulk select, enterprise nav IA
      #   DECISION_WORKSPACE  -> /findings/:id Decision Workspace (needs the engine
      #                         flag on too), /findings saved-views bar, /actions
      #                         My Actions depth, Brief -> Decision/Event
      # Prod enablement stays GATE B (operator ledger).
      - key: SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED
        # ENABLED on STAGING (2026-07-26): EAR is live here and entity-backed assets
        # deep-link into ECL — the two surfaces must flip together. Prod stays dark.
        value: "true"
      - key: SECURELOGIC_ASSET_REGISTRY_ENABLED
        value: "true"
      # ENABLED on STAGING (Option B) so a Blueprint sync activates the Findings
      # decision queue, the "Review Suggested Links" queue reskin + bulk select, and
      # the enterprise nav IA — durably (dashboard edits get reverted on sync; the
      # Blueprint must own the "true"). STAGING ONLY — production securelogic-app
      # keeps these "false" (GATE B). RUNTIME env: a restart applies, no rebuild.
      - key: SECURELOGIC_RISK_WORKSPACE_ENABLED
        value: "true"
      # ENABLED on STAGING (Option B): Decision Workspace on /findings/:id (also needs
      # the engine flag on — two-switch), Findings saved-views bar, My Actions depth,
      # Brief -> Decision/Event. STAGING ONLY; prod stays "false" (GATE B).
      - key: SECURELOGIC_DECISION_WORKSPACE_ENABLED
        value: "true"
      # ENABLED on STAGING (Option B): the app half of the risk-acceptance two-switch.
      # The engine flag (staging engine block above) opens /api/risk-acceptances; THIS
      # one lets the app call it — findings/[id]/page.tsx reads it on the app service
      # and, when unset, never fetches the acceptances, so the Decision Workspace keeps
      # the legacy one-click Accept-Risk control and the whole subsystem renders
      # nowhere. Both switches are required for the workflow to render AND function.
      # RUNTIME env (not NEXT_PUBLIC): a restart applies, no rebuild. STAGING ONLY —
      # the production app block intentionally does not receive this var (absent reads
      # false), matching the production engine block; prod enablement is GATE B.
      - key: SECURELOGIC_RISK_ACCEPTANCE_ENABLED
        value: "true"
      # ENABLED on STAGING: the scalable Risk Findings queue controls (search /
      # filter / sort toolbar, due-status urgency, server OFFSET pagination) on the
      # BROWSE queue. Because the staging app also runs RISK_WORKSPACE=true, the
      # enhanced queue renders via the browse escape hatch at /findings?queue=all
      # (the Operations Center home is unchanged). STAGING ONLY; prod stays "false"
      # (GATE B). RUNTIME env — a restart applies, no rebuild.
      - key: SECURELOGIC_FINDINGS_QUEUE_CONTROLS_ENABLED
        value: "true"
      # ENABLED on STAGING: The Briefing (Briefing Initiative B1) — the /dashboard
      # personalized composition + the workspace nav "Briefing" home label (label
      # only renders because RISK_WORKSPACE is also true here). App-only, reads
      # existing engine endpoints. STAGING ONLY; prod stays "false" (GATE B).
      # RUNTIME env — a restart applies, no rebuild.
      - key: SECURELOGIC_DASHBOARD_BRIEFING_ENABLED
        value: "true"
      # B1 demotion (Launch Completion 1), app half: staging renders the
      # DEMOTED state (engagement CTAs, retired legacy forms) to match the
      # staging engine's "false".
      - key: SECURELOGIC_LEGACY_VENDOR_WRITES_ENABLED
        value: "false"

      # STAGING session secret — a distinct 32+ char value, NEVER the prod secret.
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_TIMEOUT_SECONDS
        sync: false
      - key: SESSION_IDLE_SECONDS
        sync: false
      - key: SESSION_ABSOLUTE_SECONDS
        sync: false

      # Sentry (app) — STAGING project/env only (never the prod telemetry env).
      # All optional; unset = Sentry disabled. NEXT_PUBLIC_* are build-time.
      - key: SENTRY_DSN_APP
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN_APP
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENV
        sync: false

  # =========================================================
  # SECURELOGIC WEBSITE (Next.js marketing site)
  # Public-facing marketing site: homepage, platform, pricing,
  # Intelligence Brief product page.
  # Links to the app service for login and registration.
  # =========================================================

  - type: web
    name: securelogic-website
    region: oregon
    env: node
    plan: starter
    buildCommand: cd website && npm ci --include=dev && npm run build
    startCommand: cd website && npx serve@latest out -l $PORT
    autoDeploy: true
    # Public marketing domain. Next.js on Render is the production site
    # (the legacy WordPress host is being retired). The apex and www both
    # serve this service. NOTE: declaring domains here records intent in IaC;
    # the custom domain must still be added in the Render dashboard and the
    # DNS records pointed at Render's targets at the registrar.
    domains:
      - securelogicai.com
      - www.securelogicai.com
    envVars:
      # Environment identity. LOAD-BEARING since P1-2 (email environment
      # isolation): infra/emailEnvironment.ts tags every outbound send with
      # this value and classifies every inbound provider event against it,
      # and lib/providerSuppressionRecoveryPolicy.ts refuses the destructive
      # provider-suppression clear unless it reads exactly "production".
      # An unset value resolves to "unknown", which fails closed everywhere
      # -- safe, but it silently disables both. Declared here rather than
      # left as dashboard-only state so it survives a Blueprint sync and is
      # visible in review.
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production

      # Public URL of the securelogic-app service.
      # Used by the Nav and Footer to build login/register CTAs.
      # e.g. https://app.securelogicai.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # Canonical public URL of THIS marketing site, used for metadataBase /
      # canonical tags / OG / sitemap. Set each environment to its OWN site URL so
      # the staging build never emits production canonical/OG metadata.
      # Prod: https://www.securelogicai.com · Staging: the staging Render URL.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # Public origin of the SecureLogic engine API that the Brief signup form
      # POSTs to. Set each environment to its OWN API origin so a staging build
      # never posts subscriber emails to the production API.
      # Prod: https://api.securelogicai.com · Staging: the staging engine URL.
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # Staging mirror of securelogic-website — tracks develop so the rebuilt
  # marketing site can be previewed before it is promoted to main. No custom
  # domains: it stays on its Render-assigned URL
  # (securelogic-website-staging.onrender.com).
  - type: web
    name: securelogic-website-staging
    region: oregon
    env: node
    plan: starter
    branch: develop
    buildCommand: cd website && npm ci --include=dev && npm run build
    startCommand: cd website && npx serve@latest out -l $PORT
    autoDeploy: true
    envVars:
      # Environment identity. LOAD-BEARING since P1-2 (email environment
      # isolation): infra/emailEnvironment.ts tags every outbound send with
      # this value and classifies every inbound provider event against it,
      # and lib/providerSuppressionRecoveryPolicy.ts refuses the destructive
      # provider-suppression clear unless it reads exactly "production".
      # An unset value resolves to "unknown", which fails closed everywhere
      # -- safe, but it silently disables both. Declared here rather than
      # left as dashboard-only state so it survives a Blueprint sync and is
      # visible in review.
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production

      # Public URL of the securelogic-app service.
      # Used by the Nav and Footer to build login/register CTAs.
      # e.g. https://app.securelogicai.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # Canonical public URL of THIS marketing site, used for metadataBase /
      # canonical tags / OG / sitemap. Set each environment to its OWN site URL so
      # the staging build never emits production canonical/OG metadata.
      # Prod: https://www.securelogicai.com · Staging: the staging Render URL.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # Public origin of the SecureLogic engine API that the Brief signup form
      # POSTs to. Set each environment to its OWN API origin so a staging build
      # never posts subscriber emails to the production API.
      # Prod: https://api.securelogicai.com · Staging: the staging engine URL.
      - key: NEXT_PUBLIC_API_URL
        sync: false
