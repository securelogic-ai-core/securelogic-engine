services:
  - type: web
    name: securelogic-engine
    region: virginia
    env: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate && npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Environment identity. LOAD-BEARING since P1-2 (email environment
      # isolation): infra/emailEnvironment.ts tags every outbound send with
      # this value and classifies every inbound provider event against it,
      # and lib/providerSuppressionRecoveryPolicy.ts refuses the destructive
      # provider-suppression clear unless it reads exactly "production".
      # An unset value resolves to "unknown", which fails closed everywhere
      # -- safe, but it silently disables both. Declared here rather than
      # left as dashboard-only state so it survives a Blueprint sync and is
      # visible in review.
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production

      # Database — provision a Render Postgres instance or supply an external URL
      - key: DATABASE_URL
        sync: false

      # Redis — provision a Render Redis instance or supply an external URL
      - key: REDIS_URL
        sync: false

      # Admin access (min 16 chars; rotation: "key1,key2")
      - key: SECURELOGIC_ADMIN_KEY
        sync: false

      # OBSERVATIONAL ONLY — this does NOT restrict /admin.
      # requireAdminNetwork runs dark: it logs `admin_network_evaluated` and always
      # continues unless SECURELOGIC_ADMIN_NETWORK_ENFORCED === "true" (set nowhere).
      # Startup (selfTest.ts) still asserts this is non-empty, so it must be SET,
      # but its value is not currently load-bearing for access control.
      # Do NOT enable enforcement: staff egress is Codespaces/Azure NAT and rotates
      # per session, so a /32 list locks operators out of /admin — including the
      # /admin/ops/* endpoints used to diagnose the lockout.
      # See TENANT_ISOLATION_STANDARD.md → "NOT a required control".
      - key: SECURELOGIC_ADMIN_ALLOWED_IPS
        sync: false

      # Issue signing secret (min 16 chars; single value only — rotation not yet supported)
      - key: SECURELOGIC_SIGNING_SECRET
        sync: false

      # LemonSqueezy webhook secret (min 16 chars)
      - key: LEMON_WEBHOOK_SECRET
        sync: false

      # JWT signing secret — required for customer portal auth (HS256)
      - key: JWT_SECRET
        sync: false

      # ── Boot-critical (engine exits at boot without these) ──────────────
      # validateEnv.ts REQUIRED_ENV_PROD + validateFieldEncryptionKey(). These
      # were previously undeclared here and had to be remembered as
      # dashboard-only vars; declared now so render.yaml is a complete boot
      # contract for the engine service.

      # AES-256-GCM key — exactly 64 lowercase hex chars — encrypting sensitive
      # JSONB at rest (report_json, content_json, raw_payload). Required in prod.
      - key: FIELD_ENCRYPTION_KEY
        sync: false

      # HMAC secret (min 16 chars) signing one-click unsubscribe links.
      - key: UNSUBSCRIBE_SECRET
        sync: false

      # Verified Resend sender for outbound Intelligence Brief emails. Read by
      # briefEmailSender.ts (BRIEF_FROM_EMAIL). DISTINCT from
      # NEWSLETTER_FROM_EMAIL below, which is the transactional / recovery /
      # invite sender — both coexist and are set independently.
      - key: BRIEF_FROM_EMAIL
        sync: false

      # Base URL for CAN-SPAM unsubscribe links in Brief emails.
      - key: BRIEF_UNSUBSCRIBE_BASE_URL
        sync: false

      # Scheduler trigger secret (min 32 chars) — bearer token for
      # POST /api/admin/briefs/run-scheduler. Required at boot in production
      # per validateEnv.ts; engine refuses to start without it.
      - key: SCHEDULER_SECRET
        sync: false

      # TOTP secret encryption key — AES-256-GCM, encrypts TOTP secrets at rest.
      # Falls back to JWT_SECRET if not set.
      # Generate with: openssl rand -hex 32
      - key: MFA_SECRET_KEY
        sync: false

      # Base URL for unsubscribe links (e.g. https://app.example.com)
      - key: APP_BASE_URL
        sync: false

      # Engine's OWN public origin, used to build the SAML ACS URL the IdP posts
      # back to. Set each environment to its own engine URL so a staging SSO flow
      # uses the staging ACS endpoint. The code falls back to the production engine
      # when unset, so this MUST be set explicitly on the staging engine service.
      - key: ENGINE_URL_BASE
        sync: false

      # Stripe — optional; billing routes are disabled if not set
      - key: STRIPE_SECRET_KEY
        sync: false

      # Stripe webhook signing secret (from Stripe Dashboard > Webhooks)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Stripe Price IDs — one per paid tier
      - key: STRIPE_PRICE_ID_PROFESSIONAL
        sync: false

      - key: STRIPE_PRICE_ID_TEAMS
        sync: false

      - key: STRIPE_PRICE_ID_PLATFORM
        sync: false

      - key: STRIPE_PRICE_ID_PLATFORM_ANNUAL
        sync: false

      # URLs Stripe redirects to after checkout
      - key: STRIPE_SUCCESS_URL
        sync: false

      - key: STRIPE_CANCEL_URL
        sync: false

      # URL Stripe redirects to after the customer exits the billing portal
      - key: STRIPE_PORTAL_RETURN_URL
        sync: false

      # Stripe billing-portal configuration ID — selects the portal feature set
      # (which products/prices the customer can switch to). Read by the billing
      # portal route; without it the portal uses the Stripe account default.
      - key: STRIPE_PORTAL_CONFIGURATION_ID
        sync: false

      # Resend webhook signing secret (from Resend Dashboard > Webhooks)
      # Required: without this, bounce and complaint events return 401 and
      # are never recorded — suppression list will not auto-populate
      - key: RESEND_WEBHOOK_SECRET
        sync: false

      # Resend — used for account recovery emails (magic-link sign-in)
      # Optional: if not set, recovery requests are accepted but no email is sent
      - key: RESEND_API_KEY
        sync: false

      - key: NEWSLETTER_FROM_EMAIL
        sync: false

      # Webhook URL for worker failure alerts (e.g. Slack incoming webhook)
      - key: ALERT_WEBHOOK_URL
        sync: false

      # Required for voice transcription
      # (Whisper-1 via /api/ask/transcribe).
      # Without this key the voice button
      # returns a 503 and the user sees
      # "Could not transcribe audio."
      - key: OPENAI_API_KEY
        sync: false

      # Anthropic API key — LLM signal enrichment in the intelligence brief
      # generator (src/api/lib/intelligenceBriefGenerator.ts) and the LLM
      # control matcher (SECURELOGIC_LLM_CONTROL_MATCHER_ENABLED below, which
      # no-ops without this). Without it, brief items fall back to generic
      # template content via fallbackWhyItMatters()/fallbackRecommendedActions().
      - key: ANTHROPIC_API_KEY
        sync: false

      # Sentry error tracking (engine). DSN + environment label are set in the
      # Render dashboard, never in the repo. When SENTRY_DSN_ENGINE is unset the
      # engine boots normally with Sentry disabled. See docs/sentry-setup.md.
      - key: SENTRY_DSN_ENGINE
        sync: false

      - key: SENTRY_ENV
        sync: false

      # Platform free trial (PR-C2). Non-secret config with safe defaults, so
      # declared with explicit `value:` (not sync:false): the engine ships
      # trial-OFF and only enables it when an operator flips the flag to "true".
      # PLATFORM tiers only; card required; one trial per org. NOTE: the website
      # "Start Free Trial" CTAs are always visible, so at launch this flag MUST
      # be flipped to "true" or those CTAs charge immediately (no trial).
      - key: SECURELOGIC_PLATFORM_TRIAL_ENABLED
        value: "false"
      # Trial length in days (Stripe trial_period_days). Default 14.
      - key: TRIAL_PERIOD_DAYS
        value: "14"

      # Dormant-engine enablement — PRODUCTION (operator-authorized 2026-06-24).
      # The "match → surface → what to do next" engine, live. All three are
      # read from process.env at signal-processing time; disable any one by
      # setting it to "false". The LLM control matcher spends Anthropic credits
      # per qualifying signal (Critical/High + relevant type, ≤80 controls,
      # ≤1024 out, after-commit) — ANTHROPIC_API_KEY must be set (dashboard) or
      # it no-ops; watch console balance.
      - key: SECURELOGIC_FUZZY_VENDOR_MATCH_ENABLED   # item 3 — suggest-only, free
        value: "true"
      - key: SECURELOGIC_ACTION_ENGINE_ENABLED        # item 1 — idempotent action writes, free
        value: "true"
      - key: SECURELOGIC_RISK_LIFECYCLE_ENABLED       # Epic R1 — risk lifecycle, DARK (default off)
        value: "false"
      - key: SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED   # ECL (Priority 5) — DARK (default off); do NOT enable in prod until AD-17 grant + edge cap (H1) + graph load test (H2)
        value: "false"
      - key: SECURELOGIC_ASSET_REGISTRY_ENABLED       # EAR Phase 0 (asset registry) — DARK (default off); GATE B posture, do NOT enable in prod under the EAR goal
        value: "false"
      - key: SECURELOGIC_CONNECTOR_SCHEDULED_SYNC_ENABLED # ERIP E2.P1 (scheduled connector sync) — DARK (default off); triple fence: also requires ECL + asset-registry flags
        value: "false"
      - key: SECURELOGIC_CONNECTOR_WRITEBACK_ENABLED  # ERIP E2a (bidirectional connector writeback) — DARK (default off); only external-mutation fence; also requires ECL + asset-registry flags
        value: "false"
      - key: SECURELOGIC_RISK_INTELLIGENCE_ENABLED    # ERIP E3 (graph-aware risk intelligence) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_DECISION_WORKSPACE_ENABLED   # ERIP Package 3 (Decision Workspace) — DARK (default off); gates GET /api/findings/:id/context, plus finding creation and bulk governance decisions. Prod enablement is a separate operator ruling (GATE B); not part of the develop→main release train
        value: "false"
      - key: SECURELOGIC_DASHBOARD_BRIEFING_ENABLED   # Briefing Initiative B2 — DARK (default off). Engine half of the two-switch: opens /api/briefing/layout + /api/briefing/changes. PROMOTE ENGINE BEFORE APP. Prod stays dark per SPRINT_1 ruling D-E; enablement is a separate operator ruling
        value: "false"

      # Vendor Assurance — EG3 WAVE 1 (Reveal). Previously UNDECLARED in this
      # block, so it resolved absent→false while the staging block set it true.
      # The workspace nav surfaces "Vendor Assurance" unconditionally, so without
      # this declaration the prod menu item would appear and the API would 403.
      # Declared explicitly rather than relying on a default.
      - key: SECURELOGIC_VENDOR_ASSURANCE_ENABLED
        value: "true"

      # EG2 notification flags (declared 2026-07-30 release review) — DARK
      # (default off), listed so the operator flag inventory is complete. Both
      # initiate outbound customer email, so enablement is operator-owned:
      # staging first, prod only after the staging checks pass. The matcher
      # flag is ALSO read by the intelligence worker (declared there too) —
      # flip both services together.
      - key: SECURELOGIC_MATCHER_ALERTS_ENABLED       # EG2 s1 — coalesced Critical/High finding alerts from the automated signal→finding path; run the staging VOLUME CHECK before any prod flip
        value: "false"
      - key: SECURELOGIC_SLA_ALERTS_ENABLED           # EG2 s11 — daily 8:15 UTC SLA-breach sweep (7-day catch-up window, ledger-deduped); off = zero-DB no-op, cron inert
        value: "false"
      - key: SECURELOGIC_ASSIGNMENT_ALERTS_ENABLED    # EG2 s7 — "assigned to you" email on finding/action assignment; off = trigger returns before any query or send. Shipped ungated; gated at the develop→main release review
        value: "false"
      - key: SECURELOGIC_PREDICTIVE_INTELLIGENCE_ENABLED # ERIP E5 (explainable forecasting) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_AUTONOMOUS_OPERATIONS_ENABLED # ERIP E6 (approval-gated orchestration) — DARK (default off); human approval required
        value: "false"
      - key: SECURELOGIC_KNOWLEDGE_GRAPH_ENABLED      # ERIP E7 (knowledge graph / blast-radius) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_CAPABILITY_GATING_ENABLED    # EAR P9 (Track C dual-gate) — DARK (default off); flag on = entitlement OR per-org core_platform grant; entitlement-leg removal is a product STOP GATE, never this flag
        value: "false"
      - key: SECURELOGIC_BRIEF_APPLICABILITY_CITATION_ENABLED # EAR P11 (Brief cites applicability) — DARK (default off); double-fenced: also requires SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED
        value: "false"
      - key: SECURELOGIC_BRIEF_QUALITY_ENABLED # IQP Q4 title/summary quality contract. OFF = titles are cut mid-word at 77 chars and stored that way. BLOCKED ON STAGING VALIDATION — flip to "true" after staging confirms headings
        value: "false"
      - key: SECURELOGIC_SIGNAL_RECENCY_ENABLED # IQP Q2 recency enforcement (operator ledger OP-3). OFF = brief window filters on ingestion time, so decades-old KEV entries ship as "this period" (staging evidence 2026-08-07: CVE-2002-0367 in the Jul 26–Aug 2 brief). BLOCKED ON STAGING VALIDATION — flip to "true" after staging shows stale_signal_suppressed + a clean brief. Requires OP-2 published_at migration on this env's DB; value change reaches the process only on a deploy (same-SHA rebuild), not a restart
        value: "false"
      - key: SECURELOGIC_APPLICABILITY_WORKFLOW_ENABLED # ECL R2/S6 dispatcher — DARK (default off); requires ECL flag too
        value: "false"
      - key: SECURELOGIC_LLM_CONTROL_MATCHER_ENABLED  # item 2 — LLM suggest-only, PAID
        value: "true"

      # Canonical Intelligence Event projection (Pipeline Hardening / IE) — DARK.
      # Projects cyber_signals into the global intelligence_events layer
      # (corroboration ledger + timeline). Off => zero DB work, legacy behaviour.
      - key: SECURELOGIC_INTELLIGENCE_EVENTS_ENABLED
        value: "false"

      # Finding closure gate (ruling 2026-07-14) — DARK, and DELIBERATELY "false" in
      # PRODUCTION. Refuses to close a Finding whose remediation Actions are still open
      # (409 close_requires_remediation_complete) unless an approved risk acceptance
      # carries the risk. This CHANGES A CUSTOMER-REACHABLE API CONTRACT: a PATCH that
      # returns 200 today returns 409 with the gate on. Production enablement is a
      # SEPARATE operator ruling, taken only after staging validation and an inventory of
      # the clients/integrations that would begin receiving the 409. Off => the gate is
      # never consulted: no query, no 409, legacy behaviour byte for byte.
      - key: SECURELOGIC_FINDING_CLOSURE_GATE_ENABLED
        value: "false"

      # Intelligence Brief missed-week catch-up (boot-time recovery of a missed
      # weekly Tuesday send) — DARK (default off). Initiates outbound email, so
      # operator-owned: enable only after staging validation. Idempotency in
      # briefEmailSender guarantees it can never double-deliver. Runs in the
      # engine web service (server boot), not a worker.
      - key: SECURELOGIC_BRIEF_CATCHUP_ENABLED
        value: "false"

      # Ask SecureLogic KILL SWITCH (Sept-15 program, Ask A0). Ask shipped with
      # no flag at all — an LLM-mediated read path over customer risk data,
      # with unbounded per-request provider cost, that could not be closed
      # without cutting a release.
      #
      # Deliberately defaults to ENABLED (only the literal "false" disables it):
      # Ask is already live in production, so a default-off flag would silently
      # remove a shipped capability the moment it landed. This is a kill switch,
      # not a dark launch — turning it off is an explicit operator act.
      # Off = every /api/ask request 404s BEFORE any DB read or provider call.
      - key: SECURELOGIC_ASK_ENABLED
        value: "true"
      # B1 demotion (Launch Completion 1): the legacy Vendor Assurance write
      # routes (POST /api/vendor-assessments, POST/PATCH /api/vendor-reviews).
      # "true" = legacy writes still accepted (current prod behavior, GATE B —
      # ship dark). The demoted state ("false" -> 410 Gone + engagement
      # pointer) is validated on staging first; the prod flip is an operator
      # cutover step. Only the literal "false" disables. Reads are unaffected.
      - key: SECURELOGIC_LEGACY_VENDOR_WRITES_ENABLED
        value: "true"

      # Ask retrieval path — DARK LAUNCH (Sept-15 program, Ask A1). Switches
      # POST /api/ask from the eight-query snapshot to the platform tool
      # registry, where the model calls canonical routes in the caller's own
      # security context (entitlement, seat, capability and RLS all apply).
      #
      # Defaults OFF, unlike SECURELOGIC_ASK_ENABLED which defaults ON — the
      # reasoning is opposite and deliberate. ASK_ENABLED is a kill switch for
      # a capability already live, so default-off would silently remove shipped
      # behaviour. This one changes HOW every answer is produced and no staging
      # environment has exercised it, so default-on would flip a customer-facing
      # surface on deploy.
      #
      # Rollback is the flag alone: no migration, no data change. Retire this
      # flag AND the snapshot path once staging validates the tool path — two
      # retrieval implementations is the parallel-data-path problem this program
      # removes, acceptable only as a transition.
      - key: SECURELOGIC_ASK_TOOLS_ENABLED
        value: "false"

      # EXTERNAL VENDOR PORTAL — the platform's first unauthenticated write path
      # that touches tenant data. THE most consequential flag here.
      #
      # Defaults OFF everywhere INCLUDING non-production, unlike
      # SECURELOGIC_VENDOR_ASSURANCE_ENABLED which opens off-production for
      # developer convenience. That reasoning does not transfer: an external
      # write path must never be open by accident on a preview environment.
      #
      # Off = 404 before any handler, any DB read, and — on the exchange route —
      # before a presented token is even hashed. Enablement is GATE B and
      # requires Stop Gate B to have passed (adversarial suite, independent
      # security review, a real external tester on staging).
      #
      # Turning this off does not by itself revoke live sessions; also run the
      # mass revocation:
      #   UPDATE vendor_portal_sessions SET revoked_at = NOW() WHERE revoked_at IS NULL;
      - key: SECURELOGIC_VENDOR_PORTAL_ENABLED
        value: "false"

      # Enterprise seat model (PR #784) — LIVE in production since 2026-08-12
      # (GATE B activated 14:23 UTC, same-SHA deploy 14:27 UTC on 98e97098).
      # Gates ALL seat enforcement: requireSeat, Contributor scoping,
      # Viewer-seat read-only, grantable export, SSO-JIT default seat, API-key
      # seat binding. Strict === "true" read (requireSeat.ts); off/absent =
      # legacy authorization byte for byte. Engine web service ONLY — no
      # worker or app reads this key. This declaration is reconciled to the
      # live dashboard value so a future Blueprint sync cannot revert
      # production to dark; do NOT set it back to "false" here as a way to
      # disable enforcement — that is an operator ruling made on the service.
      # Value changes reach the process only on a deploy, not a restart.
      # Rollback = "false"/unset + same-SHA deploy. See flag matrix §1.21.
      - key: SECURELOGIC_SEAT_MODEL_ENABLED
        value: "true"

  # =========================================================
  # SECURELOGIC ENGINE — STAGING (web)
  # Tracks the develop branch. Mirrors the production engine
  # above; NODE_ENV stays "production" so all prod-conditional
  # safety checks remain active (Redis fail-closed, admin
  # rate-limit fail-closed, scheduler/encryption secret
  # enforcement, audit/retention assertions, validateEnv
  # required-env list).
  #
  # APP_ENV=staging is this service's ENVIRONMENT IDENTITY. It began as a
  # logger label, but P1-2 gave it behaviour: outbound mail is tagged with
  # it, inbound provider events are classified against it, and the
  # destructive provider-suppression clear is refused unless it reads
  # "production". Every other env var must be set to staging credentials in
  # the dashboard.
  #
  # Keep this block in lockstep with securelogic-engine above.
  # =========================================================

  - type: web
    name: securelogic-engine-staging
    region: virginia
    env: node
    plan: starter
    branch: develop
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate && node dist/api/server.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Environment identity. NO LONGER labeling-only: P1-2 made this
      # load-bearing (outbound send tagging, inbound event classification, and
      # the production-only guard on provider-suppression recovery). Prod does
      # NOT leave it unset — every service now declares it explicitly above.
      - key: APP_ENV
        value: staging

      # Staging Postgres — populate with the securelogic_staging URL in dashboard
      - key: DATABASE_URL
        sync: false

      # Staging Redis — populate in dashboard
      - key: REDIS_URL
        sync: false

      - key: SECURELOGIC_ADMIN_KEY
        sync: false

      # OBSERVATIONAL ONLY — does NOT restrict /admin. Must be set (selfTest asserts
      # non-empty) but requireAdminNetwork runs dark. Do not enable enforcement.
      # See TENANT_ISOLATION_STANDARD.md → "NOT a required control".
      - key: SECURELOGIC_ADMIN_ALLOWED_IPS
        sync: false

      - key: SECURELOGIC_SIGNING_SECRET
        sync: false

      - key: LEMON_WEBHOOK_SECRET
        sync: false

      - key: JWT_SECRET
        sync: false

      # ── Boot-critical (engine exits at boot without these) ──────────────
      # Lockstep with the prod engine block. validateEnv.ts REQUIRED_ENV_PROD +
      # validateFieldEncryptionKey() (NODE_ENV stays "production" on staging, so
      # every prod boot gate applies here too).
      - key: FIELD_ENCRYPTION_KEY
        sync: false

      - key: UNSUBSCRIBE_SECRET
        sync: false

      # BRIEF_FROM_EMAIL: verified Resend sender for Intelligence Brief emails
      # (briefEmailSender.ts). Distinct from NEWSLETTER_FROM_EMAIL below.
      - key: BRIEF_FROM_EMAIL
        sync: false

      - key: BRIEF_UNSUBSCRIBE_BASE_URL
        sync: false

      - key: SCHEDULER_SECRET
        sync: false

      - key: MFA_SECRET_KEY
        sync: false

      - key: APP_BASE_URL
        sync: false

      # Engine's OWN public origin, used to build the SAML ACS URL the IdP posts
      # back to. Set each environment to its own engine URL so a staging SSO flow
      # uses the staging ACS endpoint. The code falls back to the production engine
      # when unset, so this MUST be set explicitly on the staging engine service.
      - key: ENGINE_URL_BASE
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: STRIPE_PRICE_ID_PROFESSIONAL
        sync: false

      - key: STRIPE_PRICE_ID_TEAMS
        sync: false

      - key: STRIPE_PRICE_ID_PLATFORM
        sync: false

      - key: STRIPE_PRICE_ID_PLATFORM_ANNUAL
        sync: false

      - key: STRIPE_SUCCESS_URL
        sync: false

      - key: STRIPE_CANCEL_URL
        sync: false

      - key: STRIPE_PORTAL_RETURN_URL
        sync: false

      - key: STRIPE_PORTAL_CONFIGURATION_ID
        sync: false

      - key: RESEND_WEBHOOK_SECRET
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: NEWSLETTER_FROM_EMAIL
        sync: false

      # Webhook URL for worker failure alerts (e.g. Slack incoming webhook)
      - key: ALERT_WEBHOOK_URL
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      # Anthropic API key — required for LLM signal enrichment in the
      # intelligence brief generator (src/api/lib/intelligenceBriefGenerator.ts).
      # Without this, every brief item falls back to generic template content
      # via fallbackWhyItMatters() and fallbackRecommendedActions().
      - key: ANTHROPIC_API_KEY
        sync: false

      # Cloudflare R2 — STAGING ONLY. Vendor-assurance-intelligence Phase 0
      # ships the blob primitive against R2; production engine is intentionally
      # left unconfigured in this package. Populate R2_* in the staging
      # dashboard before running scripts/blob-storage-smoke.ts.
      # Per TENANT_ISOLATION_STANDARD.md §5: every object key MUST be prefixed
      # with org/{organizationId}/; pre-signed URLs are single-org and clamped
      # to <=120s TTL by src/api/lib/blobStorage.ts.
      - key: R2_ACCOUNT_ID
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false

      - key: R2_SECRET_ACCESS_KEY
        sync: false

      - key: R2_BUCKET
        sync: false

      - key: R2_ENDPOINT
        sync: false

      # Vendor-Assurance Intelligence (Phase 1) — STAGING ONLY.
      # Routes 404 unless this is set to 'true'. Production engine block does
      # not receive this var; production enablement is a future package decision.
      - key: SECURELOGIC_VENDOR_ASSURANCE_ENABLED
        value: "true"

      # Platform free trial (PR-C2) — lockstep with the prod engine block.
      # Non-secret config; default trial-OFF until an operator flips it to "true".
      - key: SECURELOGIC_PLATFORM_TRIAL_ENABLED
        value: "false"
      - key: TRIAL_PERIOD_DAYS
        value: "14"

      # Dormant-engine enablement — STAGING (lockstep with the prod engine block).
      # All three signal-engine capabilities on; disable any by setting "false".
      - key: SECURELOGIC_FUZZY_VENDOR_MATCH_ENABLED   # item 3 — suggest-only, free
        value: "true"
      - key: SECURELOGIC_ACTION_ENGINE_ENABLED        # item 1 — idempotent action writes, free
        value: "true"
      - key: SECURELOGIC_RISK_LIFECYCLE_ENABLED       # Epic R1 — risk lifecycle, DARK (default off)
        value: "false"
      - key: SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED   # ECL (Priority 5) — ENABLED on STAGING (2026-07-26): EAR is live here and entity-backed
        value: "true"                                 # assets deep-link into ECL; the two surfaces must flip together. Prod stays dark
                                                      # until AD-17 grant + edge cap (H1) + graph load test (H2).
      - key: SECURELOGIC_ASSET_REGISTRY_ENABLED       # EAR Phase 0 (asset registry) — DARK (default off); GATE B posture, do NOT enable in prod under the EAR goal
        value: "true"
      - key: SECURELOGIC_CONNECTOR_SCHEDULED_SYNC_ENABLED # ERIP E2.P1 (scheduled connector sync) — DARK (default off); triple fence: also requires ECL + asset-registry flags
        value: "false"
      - key: SECURELOGIC_CONNECTOR_WRITEBACK_ENABLED  # ERIP E2a (bidirectional connector writeback) — DARK (default off); only external-mutation fence; also requires ECL + asset-registry flags
        value: "false"
      - key: SECURELOGIC_RISK_INTELLIGENCE_ENABLED    # ERIP E3 (graph-aware risk intelligence) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_DECISION_WORKSPACE_ENABLED   # ERIP Package 3 (Decision Workspace) — DARK (default off); gates GET /api/findings/:id/context (read-only)
        value: "true"
      - key: SECURELOGIC_SIGNAL_RECENCY_ENABLED # IQP Q2 recency enforcement (operator ledger OP-3). ON — staging validates that the brief window suppresses old-dateAdded KEV rows (expect stale_signal_suppressed in logs and no pre-window published_at item in the next generated brief) before any prod flip. Requires OP-2 published_at migration applied to the staging DB; value change reaches the process only on a deploy (same-SHA rebuild), not a restart
        value: "true"
      - key: SECURELOGIC_DASHBOARD_BRIEFING_ENABLED   # Briefing Initiative B2 — ENABLED on STAGING: engine half of the two-switch; opens /api/briefing/layout (per-user Briefing layout persistence) for the staging app (app half is "true" below)
        value: "true"
      - key: SECURELOGIC_PREDICTIVE_INTELLIGENCE_ENABLED # ERIP E5 (explainable forecasting) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_AUTONOMOUS_OPERATIONS_ENABLED # ERIP E6 (approval-gated orchestration) — DARK (default off); human approval required
        value: "false"
      - key: SECURELOGIC_KNOWLEDGE_GRAPH_ENABLED      # ERIP E7 (knowledge graph / blast-radius) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_CAPABILITY_GATING_ENABLED    # EAR P9 (Track C dual-gate) — DARK (default off); flag on = entitlement OR per-org core_platform grant; entitlement-leg removal is a product STOP GATE, never this flag
        value: "false"
      - key: SECURELOGIC_BRIEF_APPLICABILITY_CITATION_ENABLED # EAR P11 (Brief cites applicability) — DARK (default off); double-fenced: also requires SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED
        value: "false"
      - key: SECURELOGIC_BRIEF_QUALITY_ENABLED # IQP Q4 title/summary quality contract. OFF = titles are cut mid-word at 77 chars and stored that way. ON — staging validates the Q4 title/summary quality contract
        value: "true"
      - key: SECURELOGIC_APPLICABILITY_WORKFLOW_ENABLED # ECL R2/S6 dispatcher — DARK (default off); requires ECL flag too
        value: "false"
      - key: SECURELOGIC_LLM_CONTROL_MATCHER_ENABLED  # item 2 — LLM suggest-only, PAID
        value: "true"

      # EG2 notification flags (declared 2026-07-30 release review) — DARK
      # (default off) on staging too; staging enablement for the EG2 validation
      # pass is a separate operator action (Blueprint sync, then flip here).
      - key: SECURELOGIC_MATCHER_ALERTS_ENABLED       # EG2 s1 — coalesced Critical/High finding alerts from the automated signal→finding path
        value: "false"
      - key: SECURELOGIC_SLA_ALERTS_ENABLED           # EG2 s11 — daily 8:15 UTC SLA-breach sweep (7-day catch-up window, ledger-deduped)
        value: "false"
      - key: SECURELOGIC_ASSIGNMENT_ALERTS_ENABLED    # EG2 s7 — "assigned to you" email on finding/action assignment; flip here first to validate on staging
        value: "false"

      # Finding risk-acceptance lifecycle (ruling 2026-07-12, PR #646) — STAGING
      # ONLY, for staging validation. Gates ENFORCEMENT: approved acceptance
      # closes a Finding; expiry/withdrawal reopens it; routes 404 when off.
      # The production engine block intentionally does not receive this var
      # (absent reads false) — production enablement is a separate GATE-B
      # operator decision after staging validation passes. Flag is read only by
      # the engine web service (routes + in-process expiry worker); the legacy
      # accepted population is held closed by the compat bridge, not this flag.
      - key: SECURELOGIC_RISK_ACCEPTANCE_ENABLED
        value: "true"
      # P2 (2026-07-15): email notifications for the risk-acceptance workflow — proposal to
      # the org's approvers, decision to the requester. DELIBERATELY separate from the
      # workflow flag so email can be validated (or held) independently. Staging = "true";
      # production intentionally omits it (absent reads false) — a separate operator
      # decision after staging validation, and production has the workflow off anyway so no
      # acceptance events are produced. Read only by the engine web service (the routes).
      - key: SECURELOGIC_RISK_ACCEPTANCE_NOTIFICATIONS_ENABLED
        value: "true"

      # Canonical Intelligence Event projection (Pipeline Hardening / IE) — DARK.
      # Projects cyber_signals into the global intelligence_events layer
      # (corroboration ledger + timeline). Off => zero DB work, legacy behaviour.
      - key: SECURELOGIC_INTELLIGENCE_EVENTS_ENABLED
        value: "false"

      # Finding closure gate (ruling 2026-07-14) — ships OFF, and is the FIRST place it
      # gets turned on. Staging validation (direct close, remediation completion,
      # validation close, accepted-risk close) is the gate on any production ruling, so
      # flip THIS key to "true" — and only this one — when validation begins. The prod
      # engine block keeps its own "false" and is not touched by that flip.
      - key: SECURELOGIC_FINDING_CLOSURE_GATE_ENABLED
        value: "true" # ENABLED 2026-07-14 — staging closure-gate validation. Prod block stays "false".

      # Intelligence Brief missed-week catch-up — enable in staging FIRST to
      # validate missed-week recovery; idempotency prevents any double-delivery.
      # The prod engine block keeps its own "false" and is not touched.
      - key: SECURELOGIC_BRIEF_CATCHUP_ENABLED
        value: "true" # ENABLED 2026-07-17 — O-6: staging brief dormant since May 19; the weekly cron's single Tuesday-07:00 firing chance lives in a service that redeploys on every develop commit. Catch-up recovers a missed Tuesday at next boot. Prod stays "false".

      # Ask SecureLogic KILL SWITCH (Sept-15 program, Ask A0). Ask shipped with
      # no flag at all — an LLM-mediated read path over customer risk data,
      # with unbounded per-request provider cost, that could not be closed
      # without cutting a release.
      #
      # Deliberately defaults to ENABLED (only the literal "false" disables it):
      # Ask is already live in production, so a default-off flag would silently
      # remove a shipped capability the moment it landed. This is a kill switch,
      # not a dark launch — turning it off is an explicit operator act.
      # Off = every /api/ask request 404s BEFORE any DB read or provider call.
      - key: SECURELOGIC_ASK_ENABLED
        value: "true"
      # B1 demotion (Launch Completion 1): staging runs the DEMOTED state —
      # legacy vendor writes 410 with the engagement pointer — so the cutover
      # is validated here before any prod flip. Prod stays "true" until the
      # operator flips it.
      - key: SECURELOGIC_LEGACY_VENDOR_WRITES_ENABLED
        value: "false"

      # Ask retrieval path — DARK LAUNCH (Sept-15 program, Ask A1). Switches
      # POST /api/ask from the eight-query snapshot to the platform tool
      # registry, where the model calls canonical routes in the caller's own
      # security context (entitlement, seat, capability and RLS all apply).
      #
      # Defaults OFF, unlike SECURELOGIC_ASK_ENABLED which defaults ON — the
      # reasoning is opposite and deliberate. ASK_ENABLED is a kill switch for
      # a capability already live, so default-off would silently remove shipped
      # behaviour. This one changes HOW every answer is produced and no staging
      # environment has exercised it, so default-on would flip a customer-facing
      # surface on deploy.
      #
      # Rollback is the flag alone: no migration, no data change. Retire this
      # flag AND the snapshot path once staging validates the tool path — two
      # retrieval implementations is the parallel-data-path problem this program
      # removes, acceptable only as a transition.
      - key: SECURELOGIC_ASK_TOOLS_ENABLED
        value: "false"

      # EXTERNAL VENDOR PORTAL — the platform's first unauthenticated write path
      # that touches tenant data. THE most consequential flag here.
      #
      # Defaults OFF everywhere INCLUDING non-production, unlike
      # SECURELOGIC_VENDOR_ASSURANCE_ENABLED which opens off-production for
      # developer convenience. That reasoning does not transfer: an external
      # write path must never be open by accident on a preview environment.
      #
      # Off = 404 before any handler, any DB read, and — on the exchange route —
      # before a presented token is even hashed. Enablement is GATE B and
      # requires Stop Gate B to have passed (adversarial suite, independent
      # security review, a real external tester on staging).
      #
      # Turning this off does not by itself revoke live sessions; also run the
      # mass revocation:
      #   UPDATE vendor_portal_sessions SET revoked_at = NOW() WHERE revoked_at IS NULL;
      - key: SECURELOGIC_VENDOR_PORTAL_ENABLED
        value: "false"

      # Enterprise seat model (PR #784) — ENABLED on staging 2026-08-12
      # (dashboard-set + same-SHA deploys; multi-seat walkthrough passed,
      # formal soak sign-off pending). This declaration matches the live
      # dashboard value, so the next Blueprint sync is a value no-op that
      # transfers ownership to IaC and will RESTORE the flag if the dashboard
      # var is ever lost. Do NOT set this to "false" here to disable staging
      # ad hoc — staging enforcement state is an operator decision. The prod
      # engine block keeps its own "false" and is not touched by this key.
      - key: SECURELOGIC_SEAT_MODEL_ENABLED
        value: "true"

      # Sentry error tracking (engine — staging). Kept in lockstep with the
      # production engine block above; set SENTRY_ENV=staging in the dashboard.
      # See docs/sentry-setup.md.
      - key: SENTRY_DSN_ENGINE
        sync: false

      - key: SENTRY_ENV
        sync: false

  # =========================================================
  # INTELLIGENCE WORKER (background)
  # Long-running process — runs the signal pipeline every hour.
  # Uses the same Postgres instance as the API service.
  #
  # Keep both worker definitions in lockstep; staging mirrors
  # prod env-vars except where listed.
  # =========================================================

  - type: worker
    name: securelogic-intelligence-worker
    region: virginia
    env: node
    plan: starter
    buildCommand: npm ci --include=dev && tsc -p services/intelligence-worker/tsconfig.json
    startCommand: node dist-intelligence-worker/services/intelligence-worker/src/scheduler.js
    autoDeploy: true
    envVars:
      # Environment identity. LOAD-BEARING since P1-2 (email environment
      # isolation): infra/emailEnvironment.ts tags every outbound send with
      # this value and classifies every inbound provider event against it,
      # and lib/providerSuppressionRecoveryPolicy.ts refuses the destructive
      # provider-suppression clear unless it reads exactly "production".
      # An unset value resolves to "unknown", which fails closed everywhere
      # -- safe, but it silently disables both. Declared here rather than
      # left as dashboard-only state so it survives a Blueprint sync and is
      # visible in review.
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production

      # Shared with API service — same Postgres instance
      - key: DATABASE_URL
        sync: false

      # Shared with API service — same Redis instance.
      # Required for the 15-minute KEV poll's ETag short-circuit
      # (kevPoller.ts → fetchCisaKevSignals → feedEtagStore).
      # Without this, every poll fetches the full catalog instead of 304.
      - key: REDIS_URL
        sync: false

      # Email delivery for newsletter sends
      - key: RESEND_API_KEY
        sync: false

      - key: NEWSLETTER_FROM_EMAIL
        sync: false

      # Public URL embedded in newsletter HTML links (read-online,
      # unsubscribe). Referenced by sendNewsletter.ts and
      # renderNewsletterHtml.ts. Distinct from APP_BASE_URL.
      - key: NEWSLETTER_APP_URL
        sync: false

      # Worker failure alerts (e.g. Slack incoming webhook)
      - key: ALERT_WEBHOOK_URL
        sync: false

      # Must match the main API service value — used to sign unsubscribe tokens
      # that the main API verifies at GET /unsubscribe
      - key: UNSUBSCRIBE_SECRET
        sync: false

      # Base URL of the main API (e.g. https://app.example.com) — used to build
      # unsubscribe links appended to outbound newsletter emails
      - key: APP_BASE_URL
        sync: false

      # Engine's OWN public origin, used to build the SAML ACS URL the IdP posts
      # back to. Set each environment to its own engine URL so a staging SSO flow
      # uses the staging ACS endpoint. The code falls back to the production engine
      # when unset, so this MUST be set explicitly on the staging engine service.
      - key: ENGINE_URL_BASE
        sync: false

      # Anthropic API key — required for LLM signal enrichment, executive synthesis,
      # thesis headline, cross-domain analysis, and action summary generation.
      # Without this, all briefs fall back to generic template content.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Optional: override log verbosity (default: info)
      - key: LOG_LEVEL
        sync: false

      # Dormant-engine enablement — PRODUCTION worker (the main signal-ingestion
      # volume; operator-authorized 2026-06-24). All three on; the LLM matcher
      # uses this block's ANTHROPIC_API_KEY. Disable any by setting "false".
      - key: SECURELOGIC_FUZZY_VENDOR_MATCH_ENABLED   # item 3 — suggest-only, free
        value: "true"
      - key: SECURELOGIC_ACTION_ENGINE_ENABLED        # item 1 — idempotent action writes, free
        value: "true"
      - key: SECURELOGIC_RISK_LIFECYCLE_ENABLED       # Epic R1 — risk lifecycle, DARK (default off)
        value: "false"
      - key: SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED   # ECL (Priority 5) — DARK (default off); do NOT enable in prod until AD-17 grant + edge cap (H1) + graph load test (H2)
        value: "false"
      - key: SECURELOGIC_ASSET_REGISTRY_ENABLED       # EAR Phase 0 (asset registry) — DARK (default off); GATE B posture, do NOT enable in prod under the EAR goal
        value: "false"
      - key: SECURELOGIC_CONNECTOR_SCHEDULED_SYNC_ENABLED # ERIP E2.P1 (scheduled connector sync) — DARK (default off); triple fence: also requires ECL + asset-registry flags
        value: "false"
      - key: SECURELOGIC_CONNECTOR_WRITEBACK_ENABLED  # ERIP E2a (bidirectional connector writeback) — DARK (default off); only external-mutation fence; also requires ECL + asset-registry flags
        value: "false"
      - key: SECURELOGIC_RISK_INTELLIGENCE_ENABLED    # ERIP E3 (graph-aware risk intelligence) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_DECISION_WORKSPACE_ENABLED   # ERIP Package 3 (Decision Workspace) — DARK (default off); gates GET /api/findings/:id/context (read-only)
        value: "false"
      - key: SECURELOGIC_PREDICTIVE_INTELLIGENCE_ENABLED # ERIP E5 (explainable forecasting) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_AUTONOMOUS_OPERATIONS_ENABLED # ERIP E6 (approval-gated orchestration) — DARK (default off); human approval required
        value: "false"
      - key: SECURELOGIC_KNOWLEDGE_GRAPH_ENABLED      # ERIP E7 (knowledge graph / blast-radius) — DARK (default off)
        value: "false"
      - key: SECURELOGIC_CAPABILITY_GATING_ENABLED    # EAR P9 (Track C dual-gate) — DARK (default off); flag on = entitlement OR per-org core_platform grant; entitlement-leg removal is a product STOP GATE, never this flag
        value: "false"
      - key: SECURELOGIC_BRIEF_APPLICABILITY_CITATION_ENABLED # EAR P11 (Brief cites applicability) — DARK (default off); double-fenced: also requires SECURELOGIC_ENTERPRISE_CONTEXT_ENABLED
        value: "false"
      - key: SECURELOGIC_BRIEF_QUALITY_ENABLED # IQP Q4 title/summary quality contract. OFF = titles are cut mid-word at 77 chars and stored that way. BLOCKED ON STAGING VALIDATION — flip to "true" after staging confirms headings
        value: "false"
      - key: SECURELOGIC_APPLICABILITY_WORKFLOW_ENABLED # ECL R2/S6 dispatcher — DARK (default off); requires ECL flag too
        value: "false"
      - key: SECURELOGIC_LLM_CONTROL_MATCHER_ENABLED  # item 2 — LLM suggest-only, PAID
        value: "true"

      # EG2 s1 matcher alerting (declared 2026-07-30 release review) — DARK
      # (default off). Read at signal-processing time in this worker too; the
      # engine web service declares it as well — flip both services together.
      - key: SECURELOGIC_MATCHER_ALERTS_ENABLED
        value: "false"

      # Canonical Intelligence Event projection (Pipeline Hardening / IE) — DARK.
      # Projects cyber_signals into the global intelligence_events layer
      # (corroboration ledger + timeline). Off => zero DB work, legacy behaviour.
      - key: SECURELOGIC_INTELLIGENCE_EVENTS_ENABLED
        value: "false"

