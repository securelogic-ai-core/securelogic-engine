name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel superseded runs on the same branch to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The engine `typecheck` above runs tsconfig.ci.json, whose `include` is
      # engine-only (src/api, src/engine, …) and does NOT cover app/. The Next
      # app is therefore type-checked NOWHERE in PR CI today — `next build` runs
      # only at Render deploy time, so app/ type errors surface as a red deploy,
      # not a red PR. Fold the app's own `tsc --noEmit` into this ALREADY-REQUIRED
      # job (same reasoning as the intelligence-worker build folded into `build`
      # below): it becomes a blocking gate without a branch-protection ruleset
      # change. `--include=dev` mirrors render.yaml so typescript is installed.
      - name: app typecheck
        run: cd app && npm ci --include=dev && npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Fails if a production host (app./api.securelogicai.com or the prod Render
  # service hosts) is hardcoded into app/ or website/ source, which would ship in
  # the staging build and route staging traffic to production. Zero-dependency —
  # no npm ci needed. (Also covered by the test job via envUrlDrift.test.ts.)
  url-drift:
    name: url-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
      - run: node scripts/check-env-url-drift.mjs

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # App dependencies must exist BEFORE the root suite: the root vitest run
      # includes app/src tests (same-origin proxy routes) that import next/*,
      # iron-session, etc. from app/node_modules. Without this install the root
      # suite failed on module resolution (first the Sept-15 vendor-portal
      # proxy test, then the LC-3 SSE proxy test) AND the failure skipped the
      # app render tests step below entirely — so the app suite was not
      # running in CI at all while the job was red.
      - name: app dependencies
        run: cd app && npm ci --include=dev
      - run: npm test
      # App render tests — the customer-facing route contracts (links, labels, flag
      # branches, gated states). These exist because a green 8/8 CI shipped a dashboard
      # tile linking to a query parameter the /findings page did not read (#638): the
      # engine suite asserted /api/findings, and nothing rendered a page, so nothing
      # could see it.
      #
      # Folded into this ALREADY-REQUIRED job rather than added as a new check — same
      # reasoning as `app typecheck` in the typecheck job above: it becomes a blocking
      # gate immediately, with no branch-protection ruleset change. A separate job would
      # be non-required by default, which is precisely how a broken customer route would
      # slip through again. `--include=dev` mirrors render.yaml so vitest is installed.
      - name: app render tests
        run: cd app && npm run test

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: engine build
        run: npm run build
      # The intelligence-worker is built and deployed separately, and
      # `npm run build` (tsconfig.prod.json) does NOT compile it. A worker-only
      # type error — e.g. a test mock drifting from a shared type after #251 made
      # MatcherResult.obligation_suggestion_ids required — therefore passed PR CI
      # but broke the worker DEPLOY (red for a day). Compile the worker here with
      # the same command Render runs so the break fails the PR instead. Folded
      # into the already-required `build` check so it blocks merges without a
      # branch-protection ruleset change.
      - name: intelligence-worker build
        run: npx tsc -p services/intelligence-worker/tsconfig.json

  # E1-G1 cross-org tenant-isolation harness. Deliberately a SEPARATE job from
  # `test` so the unit run stays database-free — only this job provisions
  # Postgres. The harness drives the real app over a throwaway database;
  # testDb.ts drops/recreates the schema each run.
  cross-org-isolation:
    name: cross-org-isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        # Hold the job until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Shape matches test/isolation/testDb.ts and scripts/harness-db-up.sh:
      # non-TLS (testDb.ts connects with ssl:false) and no staging/prod
      # substring (testDb.ts refuses such URLs as a safety guard).
      TEST_DATABASE_URL: postgresql://harness:harness@127.0.0.1:5432/harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run test:isolation

  # A04-G1 tenant-coverage census. WARN-ONLY in phase 1: the script emits
  # warning annotations and always exits 0, so this job never blocks a merge and
  # is intentionally NOT in the main ruleset's required-checks list. Pure bash
  # (grep) — no npm install needed. Phase 4 escalates the rogue-pool section to
  # a hard failure and promotes this job to required.
  tenant-coverage:
    name: tenant-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: bash scripts/check-tenant-coverage.sh
